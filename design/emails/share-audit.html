<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared QA audit</title>
  </head>
  <body style="margin:0;padding:0;background:#0c1528;font-family:Segoe UI,Arial,Helvetica,sans-serif;">
    <!--
      Power Automate: Body → </> Code view → paste share-audit.power-automate.html.
      Dynamic fields from HTTP trigger body:
        triggerBody()?['toEmail']          ← Outlook To (employee, or test override)
        triggerBody()?['agentEmail']       ← real employee email
        triggerBody()?['agentName']
        triggerBody()?['score']
        triggerBody()?['teamLabel']
        triggerBody()?['caseType']
        triggerBody()?['auditDateLabel']
        triggerBody()?['sharedBy']
        triggerBody()?['auditUrl']         ← /employee/audits/:id
    -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0c1528;margin:0;padding:0;width:100%;">
      <tr>
        <td align="center" style="padding:28px 16px;">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px;max-width:100%;border-radius:16px;overflow:hidden;background:#111d33;">
            <tr>
              <td align="center" style="padding:0;background:linear-gradient(180deg,#111d33 0%,#163a5c 42%,#38b4e5 78%,#7ec8e8 100%);">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="right" style="padding:8px 28px 0;text-align:right;font-size:13px;">
                      <a
                        href="AUDIT_URL"
                        style="color:#9fd8f0;text-decoration:underline;font-weight:600;"
                      >View audit</a>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:20px 28px 18px;">
                      <div style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;letter-spacing:0.14em;color:#9fd8f0;line-height:1.2;">
                        DETROIT&nbsp;<span style="color:rgba(255,255,255,0.45);font-weight:400;">|</span>&nbsp;AXLE<sup style="font-size:10px;letter-spacing:0;">™</sup>
                      </div>
                      <div style="margin-top:10px;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.72);">
                        Quality Assurance
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:0 28px 8px;font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:#ffffff;">
                      Shared audit
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:0 28px 6px;font-size:26px;font-weight:700;color:#ffffff;">
                      AGENT_NAME
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:0 28px 8px;font-size:15px;color:#ffffff;">
                      Score SCORE% · TEAM_LABEL
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:0 28px 18px;font-size:13px;color:#cfe8f5;">
                      CASE_TYPE · AUDIT_DATE
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:0 36px 36px;font-size:15px;line-height:1.55;color:#ffffff;">
                      SHARED_BY shared this QA audit with you. Open it in the portal to review the details.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:16px 28px 22px;font-size:11px;color:#7a93b0;background:#0c1528;">
                Detroit Axle · Quality Assurance
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
