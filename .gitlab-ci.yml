# Replaces GitLab Auto DevOps (build / test / code_quality).
# Those jobs need a container registry and a code-quality runner, which this
# project does not have, so every push was failing before a deploy could start.

stages:
  - test
  - build

backend:
  stage: test
  image: python:3.12-bookworm
  script:
    # Shell runner is Python 3.10 and ignores image:. Django 6.1 needs 3.12.
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv python install 3.12
    - uv venv --python 3.12 "$CI_PROJECT_DIR/.venv"
    - . "$CI_PROJECT_DIR/.venv/bin/activate"
    - uv pip install -r backend/requirements.txt
    - export DEBUG=true
    - export USE_HTTPS=false
    - export DJANGO_SECRET_KEY=ci-test-secret-key-not-for-production
    - unset DJANGO_DB_ENGINE || true
    - unset DJANGO_DB_NAME || true
    - unset DJANGO_DB_USER || true
    - unset DJANGO_DB_PASSWORD || true
    - unset DJANGO_DB_HOST || true
    - unset DJANGO_DB_PORT || true
    - cd backend
    - python manage.py check
    - python manage.py test accounts external_data -v 2

frontend:
  stage: build
  image: node:22-bookworm-slim
  script:
    # Shell runner ignores image:. Its npm cannot read lockfileVersion 3.
    - |
      case "$(uname -m)" in
        x86_64) NODE_ARCH=x64 ;;
        aarch64|arm64) NODE_ARCH=arm64 ;;
        *) echo "unsupported arch $(uname -m)"; exit 1 ;;
      esac
      NODE_VERSION=v22.23.3
      PREFIX="$CI_PROJECT_DIR/.node"
      mkdir -p "$PREFIX"
      curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-${NODE_ARCH}.tar.gz" | tar -xz -C "$PREFIX" --strip-components=1
      echo "$PREFIX/bin" >> "$CI_PROJECT_DIR/.node-path"
    - export PATH="$(cat "$CI_PROJECT_DIR/.node-path"):$PATH"
    - node -v
    - npm -v
    - cd web
    - npm ci
    - npm run lint
    - npm run build
