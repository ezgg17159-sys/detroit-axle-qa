# Replaces GitLab Auto DevOps (build / test / code_quality).
# Those jobs need a container registry and a code-quality runner, which this
# project does not have, so every push was failing before a deploy could start.

stages:
  - test
  - build

backend:
  stage: test
  image: python:3.12-bookworm
  script:
    # Shell runner has python3 only. No python, no python3-venv, and image: is ignored.
    - python3 -V
    - python3 -m pip --version || curl -sS https://bootstrap.pypa.io/get-pip.py | python3 - --user
    - export PATH="$HOME/.local/bin:$PATH"
    - python3 -m pip install --user --upgrade pip
    # Tests use SQLite. Skip the Postgres driver so this job does not need a compiler.
    - python3 -c "from pathlib import Path; src=Path('backend/requirements.txt'); Path('backend/requirements-ci.txt').write_text(''.join(line for line in src.read_text().splitlines(True) if not line.startswith('psycopg2')))"
    - python3 -m pip install --user --no-cache-dir -r backend/requirements-ci.txt
    - export DEBUG=true
    - export USE_HTTPS=false
    - export DJANGO_SECRET_KEY=ci-test-secret-key-not-for-production
    - unset DJANGO_DB_ENGINE || true
    - unset DJANGO_DB_NAME || true
    - unset DJANGO_DB_USER || true
    - unset DJANGO_DB_PASSWORD || true
    - unset DJANGO_DB_HOST || true
    - unset DJANGO_DB_PORT || true
    - cd backend
    - python3 manage.py check
    - python3 manage.py test accounts external_data -v 2

frontend:
  stage: build
  image: node:22-bookworm-slim
  script:
    - cd web
    - npm ci
    - npm run lint
    - npm run build
