# Replaces GitLab Auto DevOps (build / test / code_quality).
# Those jobs need a container registry and a code-quality runner, which this
# project does not have, so every push was failing before a deploy could start.

stages:
  - test
  - build

backend:
  stage: test
  image: python:3.12-slim-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libpq5
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - pip install --no-cache-dir -r backend/requirements.txt
  script:
    # Project CI variables are for the server. Tests always use SQLite.
    - export DEBUG=true
    - export USE_HTTPS=false
    - export DJANGO_SECRET_KEY=ci-test-secret-key-not-for-production
    - unset DJANGO_DB_ENGINE DJANGO_DB_NAME DJANGO_DB_USER DJANGO_DB_PASSWORD DJANGO_DB_HOST DJANGO_DB_PORT || true
    - cd backend
    - python manage.py check
    - python manage.py test accounts external_data -v 2

frontend:
  stage: build
  image: node:22-bookworm-slim
  script:
    - cd web
    - npm ci
    - npm run lint
    - npm run build
