# Replaces GitLab Auto DevOps (build / test / code_quality).
# Those jobs need a container registry and a code-quality runner, which this
# project does not have, so every push was failing before a deploy could start.

stages:
  - test
  - build

backend:
  stage: test
  image: python:3.12-bookworm
  script:
    # Kobe Generic Runner 4 is a shell executor. It ignores image: and has python3, not python.
    - python3 -V
    - python3 -m venv "$CI_PROJECT_DIR/.venv"
    - . "$CI_PROJECT_DIR/.venv/bin/activate"
    - python -m pip install --upgrade pip
    # Tests use SQLite. Skip the Postgres driver so this job does not need a compiler.
    - python -c "from pathlib import Path; src=Path('backend/requirements.txt'); Path('backend/requirements-ci.txt').write_text(''.join(line for line in src.read_text().splitlines(True) if not line.startswith('psycopg2')))"
    - python -m pip install --no-cache-dir -r backend/requirements-ci.txt
    - export DEBUG=true
    - export USE_HTTPS=false
    - export DJANGO_SECRET_KEY=ci-test-secret-key-not-for-production
    - unset DJANGO_DB_ENGINE || true
    - unset DJANGO_DB_NAME || true
    - unset DJANGO_DB_USER || true
    - unset DJANGO_DB_PASSWORD || true
    - unset DJANGO_DB_HOST || true
    - unset DJANGO_DB_PORT || true
    - cd backend
    - python manage.py check
    - python manage.py test accounts external_data -v 2

frontend:
  stage: build
  image: node:22-bookworm-slim
  script:
    - cd web
    - npm ci
    - npm run lint
    - npm run build
